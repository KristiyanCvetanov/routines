name: ebag offers

# Daily sweep of ebag.bg: score every product, replace the store's rows in
# `deals`, and push watch-list offers that clear the alert threshold as a
# notification through the grocery-deal app.
#
# 05:30 UTC is 08:30 in Sofia. GitHub runs cron on UTC and does not shift for
# daylight saving, so this drifts an hour in winter -- which does not matter
# for a daily job. Scheduled runs can also start late when GitHub is busy;
# nothing here depends on the exact minute.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: score and report only, no database write, no notification"
        type: boolean
        default: false

# A slow sweep must never overlap the next day's run.
concurrency:
  group: ebag-offers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ebag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ebag/requirements.txt

      - run: pip install -r requirements.txt

      - name: Sweep, score and load
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The grocery-deal app's /api/push/ebag, and the shared secret its
          # pipeline-facing endpoints authenticate with. Unset, the run still
          # sweeps and loads; it prints the notification instead of sending it.
          EBAG_PUSH_URL: ${{ secrets.EBAG_PUSH_URL }}
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}
